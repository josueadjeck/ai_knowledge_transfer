name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-security:
    name: Build, test and security gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AiKnowledgeTransfer.slnx

      - name: Build
        run: dotnet build AiKnowledgeTransfer.slnx --configuration Release --no-restore

      - name: Publish API artifact
        run: dotnet publish src/AiKnowledgeTransfer.Api/AiKnowledgeTransfer.Api.csproj --configuration Release --no-build --output artifacts/api

      - name: Publish Web artifact
        run: dotnet publish src/AiKnowledgeTransfer.Web/AiKnowledgeTransfer.Web.csproj --configuration Release --no-build --output artifacts/web

      - name: Generate dependency inventory
        run: |
          mkdir -p artifacts/security
          dotnet list AiKnowledgeTransfer.slnx package --include-transitive --format json > artifacts/security/dotnet-package-inventory.json

      - name: Generate SPDX SBOM
        shell: pwsh
        run: ./scripts/security/generate-spdx-sbom.ps1 -InventoryPath artifacts/security/dotnet-package-inventory.json -OutputPath artifacts/security/sbom.spdx.json

      - name: Container policy scan
        shell: pwsh
        run: ./scripts/security/container-policy-scan.ps1 -OutputPath artifacts/security/container-policy-scan.json

      - name: Build API container image
        run: docker build --file Dockerfile.api --tag ai-knowledge-transfer-api:ci .

      - name: Build Web container image
        run: docker build --file Dockerfile.web --tag ai-knowledge-transfer-web:ci .

      - name: Scan API container image vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ai-knowledge-transfer-api:ci
          format: json
          output: artifacts/security/container-vulnerability-scan-api.json
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Scan Web container image vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ai-knowledge-transfer-web:ci
          format: json
          output: artifacts/security/container-vulnerability-scan-web.json
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Check container image vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys

          files = [
              "artifacts/security/container-vulnerability-scan-api.json",
              "artifacts/security/container-vulnerability-scan-web.json",
          ]
          findings = []
          for path in files:
              with open(path, encoding="utf-8") as handle:
                  payload = json.load(handle)
              for result in payload.get("Results", []) or []:
                  for vulnerability in result.get("Vulnerabilities", []) or []:
                      findings.append({
                          "artifact": path,
                          "target": result.get("Target"),
                          "id": vulnerability.get("VulnerabilityID"),
                          "package": vulnerability.get("PkgName"),
                          "severity": vulnerability.get("Severity"),
                          "installedVersion": vulnerability.get("InstalledVersion"),
                          "fixedVersion": vulnerability.get("FixedVersion"),
                      })

          if findings:
              print(json.dumps(findings, indent=2))
              sys.exit("High or critical container image vulnerability detected.")
          PY

      - name: Generate container image inventory
        run: |
          docker image inspect ai-knowledge-transfer-api:ci ai-knowledge-transfer-web:ci > artifacts/security/container-images.json

      - name: Test
        run: dotnet test AiKnowledgeTransfer.slnx --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Check vulnerable packages
        shell: bash
        run: |
          set -euo pipefail
          dotnet list AiKnowledgeTransfer.slnx package --vulnerable --include-transitive --format json > artifacts/security/vulnerable-packages.json
          python - <<'PY'
          import json
          import sys

          with open("artifacts/security/vulnerable-packages.json", encoding="utf-8") as handle:
              payload = json.load(handle)

          findings = []

          def walk(value):
              if isinstance(value, dict):
                  vulnerabilities = value.get("vulnerabilities")
                  if isinstance(vulnerabilities, list) and vulnerabilities:
                      findings.append(value)
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)

          walk(payload)
          if findings:
              print(json.dumps(findings, indent=2))
              sys.exit("Vulnerable NuGet package detected.")
          PY

      - name: Static source security scan
        shell: pwsh
        run: ./scripts/security/static-source-scan.ps1 -OutputPath artifacts/security/static-source-scan.json

      - name: Basic secret pattern scan
        shell: bash
        run: |
          set -euo pipefail
          patterns=(
            'sk-[A-Za-z0-9_-]{20,}'
            'OPENAI_API_KEY[[:space:]]*=[[:space:]]*["'\'']?[^"'\''[:space:]]+'
            'AKT_DB_CONNECTION_STRING[[:space:]]*=[[:space:]]*["'\'']?[^"'\''[:space:]]+'
            'password[[:space:]]*=[[:space:]]*["'\'']?[^"'\''[:space:]]+'
          )

          for pattern in "${patterns[@]}"; do
            if grep -RInE \
              --exclude-dir=.git \
              --exclude-dir=bin \
              --exclude-dir=obj \
              --exclude='*.md' \
              --exclude='ci.yml' \
              "$pattern" .; then
              echo "Potential secret pattern found. Remove secrets from source control."
              exit 1
            fi
          done

      - name: Upload security inventory
        uses: actions/upload-artifact@v4
        with:
          name: security-inventory
          path: artifacts/security
